[package]
name = "admin-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
thiserror = "2.0"
reqwest = { version = "0.13", features = ["json"] }
common = { path = "../core/common/" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
features_lib = { path = "../core/features_lib/" }
rest_api_types = { path = "../rest_api_types" }
rest_api_auth = { path = "../rest_api_auth/" }
forge-release = { path = "../file-auth/forge-release/" }

[dev-dependencies]
http = "1.0"
mockito = "1.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"

[lints]
workspace = true
