[package]
name = "client-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
features_lib = { path = "../core/features_lib/" }
rest_api_types = { path = "../rest_api_types" }
forge-url = { path = "../file-auth/forge-url" }
url = "2.5"
reqwest = { version = "0.13", features = ["json", "stream"] }
sha2 = "0.11"
digest = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde_json = "1.0"
futures-util = "0.3"
tempfile = "3"
serde = "1.0.228"

[lints]
workspace = true

[dev-dependencies]
chrono = "0.4.43"
mockito = "1.7"
test_helpers = { path = "../core/test_helpers/" }
features_lib = { path = "../core/features_lib/", features = ["test-utils"] }
anyhow = "1.0"
