[package]
name = "signatures"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6"
base64 = "0.23.0"
chacha20poly1305 = "0.11"
ssh-key = { version = "0.6", default-features = false, features = [
  "alloc",
  "ed25519",
  "encryption",
] }
zeroize = "1.8"
serde_json = "1.0.143"
thiserror = "2.0.12"
common = { path = "../common/" }
constants = { path = "../constants/" }
serde = "1.0.228"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
rand = "0.8"

[dev-dependencies]
anyhow = "1.0.98"
tempfile = "3.20.0"

[features]
# Exposes test-only helpers (e.g., Argon2Params::TEST) to downstream test
# consumers such as test_helpers and the asfaload_ssh_interop integration
# test. Gating these ensures weak crypto parameters cannot slip into prod
# builds.
test-utils = []

[[test]]
name = "asfaload_ssh_interop"
required-features = ["test-utils"]

[lints]
workspace = true
