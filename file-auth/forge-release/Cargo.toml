[package]
name = "forge-release"
version = "0.1.0"
edition = "2024"

[features]
test-utils = []

[dependencies]
features_lib = { path = "../../core/features_lib/" }
forge-url = { path = "../forge-url/" }
common = { path = "../../core/common/" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
url = "2.5"
thiserror = "2.0"
base64 = "0.23.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
